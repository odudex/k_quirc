name: QR Decode Validation

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      versions:
        description: 'QR version range (e.g. 1-6, 1-27)'
        default: '1-27'
      ecc:
        description: 'ECC levels (comma-separated)'
        default: 'L,M,Q,H'
      modes:
        description: 'Encoding modes (comma-separated)'
        default: 'numeric,alphanumeric,byte'
      ppm:
        description: 'Pixels-per-module values (comma-separated)'
        default: '3,5,8,13,20'
      fill:
        description: 'Fill percentages (comma-separated)'
        default: '90'
      frames:
        description: 'Frame sizes (comma-separated)'
        default: '320,480,640'
      iterations:
        description: 'Random payloads per configuration'
        default: '3'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          sudo apt-get install -y clang-format qrencode
          pip install -r test/validation/requirements.txt

      - name: Check formatting
        run: ./scripts/format.sh check

      - name: Build test harness
        run: |
          cd test
          cmake -B build_ci
          cmake --build build_ci

      - name: Run version database invariant test
        run: test/build_ci/k_quirc_version_db_test

      - name: Run payload decoder test
        run: test/build_ci/k_quirc_decode_payload_test

      - name: Run API contract test
        run: test/build_ci/k_quirc_api_test

      - name: Run two-level image test
        run: test/build_ci/k_quirc_bimodal_test

      - name: Run threshold convergence test
        run: test/build_ci/k_quirc_convergence_test

      # The two defects this guards against were invisible to the validation
      # matrix - one was an out-of-bounds read into adjacent .rodata, the other
      # a left-shift of a negative value. Neither changes the pass/fail of a
      # well-formed symbol, so only a sanitizer sees them.
      - name: Build sanitized harness
        run: |
          cd test
          cmake -B build_asan -DK_QUIRC_SANITIZE=ON
          cmake --build build_asan

      - name: Run tests under ASan/UBSan
        run: |
          test/build_asan/k_quirc_version_db_test
          test/build_asan/k_quirc_decode_payload_test
          test/build_asan/k_quirc_api_test
          test/build_asan/k_quirc_bimodal_test
          test/build_asan/k_quirc_convergence_test

      # Sanitized sweep over real images. Deliberately a narrow slice of the
      # matrix below - the point is to put the identify/decode path under the
      # sanitizers, not to re-run coverage at ~20x the cost.
      - name: Run sanitized image sweep
        run: >
          python3 test/validation/run_validation.py
          --binary test/build_asan/k_quirc_test
          --versions 1-6 --ecc L,H --modes numeric,alphanumeric,byte
          --ppm 5,13 --frames 480 --fill 90 --iterations 1

      - name: Run validation
        run: >
          python3 test/validation/run_validation.py
          --versions ${{ inputs.versions || '1-27' }}
          --ecc ${{ inputs.ecc || 'L,M,Q,H' }}
          --modes ${{ inputs.modes || 'numeric,alphanumeric,byte' }}
          --ppm ${{ inputs.ppm || '3,5,8,13,20' }}
          --fill ${{ inputs.fill || '90' }}
          --frames ${{ inputs.frames || '320,480,640' }}
          --iterations ${{ inputs.iterations || '3' }}
          --json > validation-results.json

      - name: Show results summary
        if: always()
        run: |
          python3 <<'PY'
          import json
          d = json.load(open('validation-results.json'))
          s = d['summary']
          parts = [f"{s['passed']}/{s['total']} passed ({s['pass_rate']}%)"]
          parts.append(f"{s['expected_failures']} expected failures")
          if s.get('regressions', 0):
              parts.append(f"REGRESSIONS: {s['regressions']}")
          if s.get('newly_passing', 0):
              parts.append(f"newly passing: {s['newly_passing']} ***")
          print(', '.join(parts))
          PY

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: |
            validation-results.json
            validation-results.csv

      - name: Upload failure images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-images
          path: test/validation/failures/
